<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2A3F5F" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="480" height="300" fill="#14213D"/>
  <rect width="480" height="300" fill="url(#grid2)"/>

  <!-- abstract base class box -->
  <g font-family="'IBM Plex Mono', monospace">
    <rect x="180" y="30" width="150" height="70" fill="none" stroke="#F2A65A" stroke-width="1.5"/>
    <line x1="180" y1="52" x2="330" y2="52" stroke="#F2A65A" stroke-width="1"/>
    <text x="255" y="45" text-anchor="middle" font-size="12" fill="#F2A65A">«abstract»</text>
    <text x="255" y="70" text-anchor="middle" font-size="12" fill="#E8ECF1">Empleado</text>
    <line x1="180" y1="76" x2="330" y2="76" stroke="#F2A65A" stroke-width="1"/>
    <text x="188" y="92" font-size="9" fill="#8CA0BE">+ calcular_salario()</text>

    <!-- inheriting classes -->
    <rect x="40" y="190" width="150" height="60" fill="none" stroke="#5C8B93" stroke-width="1.5"/>
    <text x="115" y="215" text-anchor="middle" font-size="12" fill="#E8ECF1">EmpleadoFijo</text>
    <line x1="40" y1="222" x2="190" y2="222" stroke="#5C8B93" stroke-width="1"/>
    <text x="48" y="238" font-size="9" fill="#8CA0BE">- salario_base</text>

    <rect x="290" y="190" width="150" height="60" fill="none" stroke="#5C8B93" stroke-width="1.5"/>
    <text x="365" y="215" text-anchor="middle" font-size="12" fill="#E8ECF1">EmpleadoPorHoras</text>
    <line x1="290" y1="222" x2="440" y2="222" stroke="#5C8B93" stroke-width="1"/>
    <text x="298" y="238" font-size="9" fill="#8CA0BE">- horas_trabajadas</text>

    <!-- inheritance arrows -->
    <g fill="none" stroke="#E8ECF1" stroke-width="1.5">
      <line x1="115" y1="190" x2="230" y2="100"/>
      <line x1="365" y1="190" x2="280" y2="100"/>
      <path d="M225 108 L230 100 L238 106" fill="none"/>
      <path d="M272 106 L280 100 L285 108" fill="none"/>
    </g>
  </g>
</svg>
